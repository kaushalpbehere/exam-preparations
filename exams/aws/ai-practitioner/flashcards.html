        <h1>AWS AI Practitioner</h1>
        <h2>Flashcards</h2>
        <div class="flashcard-container" id="fc-container">
            <div class="flashcard" id="card">
                <div class="card-inner" id="card-inner">
                    <div class="card-front" id="card-front">Loading...</div>
                    <div class="card-back" id="card-back">Loading...</div>
                </div>

        <div class="fc-controls">
            <button class="btn" id="prev-btn">← Prev</button>

        </div>

    <script>
        const cards = [
            { f: 'Which AWS service provides the easiest way to access high-performing Foundation                 Models (FMs) from leading AI startups via a single API? (A) SageMaker (B) Bedrock (C) Q (D) Comprehend', b: 'Answer: B - Amazon Bedrock is the fully managed service for accessing FMs via API.' },
            { f: 'What is "RAG" in the context of Generative AI? (A) Random Access Generation (B)                 Retrieval-Augmented Generation (C) Rapid AI Growth (D) Robotic Auto Generator', b: 'Answer: B - RAG enhances model output by retrieving relevant info from authorized                 knowledge bases before generating a response.' },
            { f: 'A company wants to build an ML model without writing any code. (A) SageMaker Studio                 (B) SageMaker Canvas (C) SageMaker Notebooks (D) EC2 DLAMI', b: 'Answer: B - SageMaker Canvas provides a visual, no-code interface for building ML                 models.' },
            { f: 'You need to convert customer service call recordings into text for analysis. (A)                 Polly (B) Transcribe (C) Translate (D) Lex', b: 'Answer: B - Amazon Transcribe converts speech to text (ASR).' },
            { f: 'Which technique involves providing a few examples in the prompt to guide the model?                 (A) Zero-shot prompting (B) Few-shot prompting (C) Fine-tuning (D) Pre-training', b: 'Answer: B - Few-shot prompting enables in-context learning by providing examples within                 the prompt.' },
            { f: 'Which Bedrock feature ensures your application blocks harmful content and PII? (A)                 Agents (B) Knowledge Bases (C) Guardrails (D) Provisioned Throughput', b: 'Answer: C - Guardrails for Amazon Bedrock implements responsible AI policies to filter                 content.' },
            { f: 'What is the role of "Tokens" in pricing for LLMs? (A) API keys (B) Access currency                 (C) Units of text (input/output) processed (D) User sessions', b: 'Answer: C - GenAI models (like Bedrock) typically charge per 1,000 input tokens and                 1,000 output tokens.' },
            { f: 'You need to detect sentiment (Positive/Negative) in product reviews. (A) Comprehend                 (B) Rekognition (C) Forecast (D) Personalize', b: 'Answer: A - Amazon Comprehend uses NLP to find insights like sentiment, entities, and                 key phrases in text.' },
            { f: 'Which parameter controls the "randomness" or "creativity" of an LLM\\'s output? (A)                 Top-K (B) Temperature (C) Max Tokens (D) Stop sequence', b: 'Answer: B - Temperature controls randomness. Low temperature = deterministic/focused;                 High = creative/random.' },
            { f: 'A bank wants to detect potential fraud patterns in transaction data using ML. (A)                 Amazon Fraud Detector (B) Amazon Monitron (C) Amazon Lookout for Vision (D) Amazon Kendra', b: 'Answer: A - Amazon Fraud Detector is a fully managed service specific for detecting                 fraud.' },
            { f: 'Which service allows developers to build conversational interfaces (Chatbots)? (A)                 Polly (B) Connect (C) Lex (D) Textract', b: 'Answer: C - Amazon Lex builds conversational interfaces using voice and text (same tech                 as Alexa).' },
            { f: 'You want to extract key/value pairs and tables from scanned PDF invoices. (A)                 Rekognition (B) Textract (C) Transcribe (D) Translate', b: 'Answer: B - Textract goes beyond OCR to extract structured data (forms, tables) from                 documents.' },
            { f: 'What is "Fine-Tuning"? (A) Changing the API parameters (B) Adapting a pre-trained                 model with a smaller, domain-specific dataset (C) Building a model from scratch (D) Reducing costs', b: 'Answer: B - Fine-tuning adapts a generic FM to a specific task using your own labeled                 data.' },
            { f: 'How does Amazon Bedrock handle your data privacy? (A) It uses it to train public                 models (B) It sells it (C) Data is not used to improve base models and stays in your region (D) It is                 public', b: 'Answer: C - AWS guarantees that your data used in Bedrock is NOT used to train the                 public base foundation models.' },
            { f: 'Which SageMaker tool detects bias in your data and models? (A) SageMaker Debugger                 (B) SageMaker Clarify (C) SageMaker Pipelines (D) SageMaker Edge', b: 'Answer: B - Clarify provides bias detection (pre/post training) and model explainability                 (SHAP values).' },
            { f: 'Identify inappropriate content in images uploaded by users. (A) Rekognition Content                 Moderation (B) Comprehend (C) GuardDuty (D) Macie', b: 'Answer: A - Rekognition DetectModerationLabels identifies explicit or suggestive content                 in images/videos.' },
            { f: 'Which AI capability allows a system to generate *new* content like images or text?                 (A) Discriminative AI (B) Generative AI (C) Reinforcement Learning (D) Regression', b: 'Answer: B - Generative AI creates new content. Discriminative AI classifies existing                 data.' },
            { f: 'You need to create a search engine for your corporate documents that understands                 natural language questions. (A) OpenSearch (B) Kendra (C) RDS (D) Neptune', b: 'Answer: B - Amazon Kendra is an intelligent enterprise search service powered by ML.' },
            { f: 'Which vector database capability is available in Knowledge Bases for Bedrock? (A)                 Aurora Serverless (B) OpenSearch Serverless (C) DynamoDB (D) Redshift', b: 'Answer: B - Knowledge Bases for Bedrock manages the vector store, heavily utilizing                 OpenSearch Serverless.' },
            { f: 'What is "Hallucination" in LLMs? (A) The model crashes (B) The model generates                 confident but factually incorrect information (C) The model becomes sentient (D) The model refuses to                 answer', b: 'Answer: B - Hallucination is when an AI generates false info presented as fact. RAG                 helps fix this.' },
            { f: 'Amazon Q is primarily: (A) A database (B) An AI-powered assistant for businesses                 and developers (C) A storage service (D) A firewall', b: 'Answer: B - Amazon Q is a GenAI-powered assistant tailored for work (coding, business                 intelligence, AWS console help).' },
            { f: 'Which customized hardware does AWS offer for training ML models? (A) Graviton (B)                 Trainium (C) Inferentia (D) Nitro', b: 'Answer: B - AWS Trainium is purpose-built silicon for efficient ML training. (Inferentia                 is for inference).' },
            { f: 'Which deployment option is "Serverless" for SageMaker inference? (A) Real-time                 inference (B) Serverless Inference (C) Asynchronous Inference (D) Batch Transform', b: 'Answer: B - SageMaker Serverless Inference allows you to deploy models without managing                 underlying instances (pay for duration).' },
            { f: 'Automate the review of low-confidence predictions from a model by sending them to                 humans. (A) Ground Truth (B) Augmented AI (A2I) (C) Mechanical Turk (D) Step Functions', b: 'Answer: B - A2I (Augmented AI) makes it easy to build workflows for human review of ML                 predictions.' },
            { f: 'Which service helps create high-quality training datasets by managing human                 labelers? (A) SageMaker Ground Truth (B) Glue (C) Macie (D) Inspector', b: 'Answer: A - Ground Truth helps build Training Data sets by labeling images/text/etc.' },
            { f: 'What is the benefit of "Provisioned Throughput" in Bedrock? (A) Lower cost for low                 usage (B) Guaranteed capacity for consistent performance (C) Free tier (D) Public access', b: 'Answer: B - Provisioned Throughput reserves model units for you, ensuring consistent                 performance for high-volume prod workloads.' },
            { f: 'You want to execute a sequence of actions: "Check inventory, if low, order more".                 How can an LLM do this? (A) RAG (B) Agents for Amazon Bedrock (C) Fine-tuning (D) Embeddings', b: 'Answer: B - Agents can determine intent and call APIs (like an inventory system) to                 perform actions.' },
            { f: 'Convert numbers into a vector format that represents their semantic meaning. (A)                 Tokenization (B) Embeddings (C) Parsing (D) Encryption', b: 'Answer: B - Embeddings models (like Titan Embeddings) convert text/data into numerical                 vectors.' },
            { f: 'Provide personalized product recommendations. (A) Amazon Personalize (B) Amazon                 Forecast (C) Connect (D) Pinpoint', b: 'Answer: A - Amazon Personalize uses ML to create real-time recommendations (same tech as                 Amazon.com).' },
            { f: 'Detect anomalies in industrial equipment using sensors. (A) Monitron / Lookout for                 Equipment (B) Rekognition (C) Transcribe (D) Translate', b: 'Answer: A - Amazon Monitron and Lookout for Equipment are primarily for Predictive                 Maintenance.' },
            { f: 'Which feature prevents an LLM from responding to "How to make a bomb"? (A) Context                 Window (B) Guardrails (C) Temperature (D) Top-P', b: 'Answer: B - Guardrails can be configured to block dangerous, hateful, or specific                 categories of content.' },
            { f: 'You need to deploy a model at the "Edge" (on a device). (A) SageMaker Neo / Edge                 Manager (B) CloudFront (C) Outposts (D) Fargate', b: 'Answer: A - SageMaker Neo compiles models to run on specific hardware/edge devices.' },
            { f: 'Which cost model is "Pay-per-token"? (A) SageMaker Training (B) Bedrock On-Demand                 (C) Bedrock Provisioned (D) EC2', b: 'Answer: B - Bedrock On-Demand pricing is based on input/output tokens processed.' },
            { f: 'Improve code quality and security scans in your IDE. (A) CodeWhisperer (now part of                 Amazon Q Developer) (B) CodeBuild (C) CodeDeploy (D) Cloud9', b: 'Answer: A - Amazon Q Developer (formerly CodeWhisperer) provides code suggestions and                 security scans.' },
            { f: 'What defines the "Context Window" of an LLM? (A) The screen size (B) The amount of                 information (tokens) the model can consider at once (C) The training time (D) The latency', b: 'Answer: B - A larger context window (e.g., 200k tokens in Claude 3) allows processing                 larger documents/inputs in one go.' },
            { f: 'Model evaluation metric "ROUGE" is typically used for: (A) Image classification (B)                 Text Summarization (C) Audio quality (D) Fraud detection', b: 'Answer: B - ROUGE is a standard metric for evaluating automatic summarization.' },
            { f: 'Which text capability helps identify "Who" or "What" is mentioned? (A) Key Phrase                 Extraction (B) Entity Recognition (NER) (C) Sentiment Analysis (D) Syntax Analysis', b: 'Answer: B - NER (Named Entity Recognition) identifies people, places, organizations,                 dates, etc.' },
            { f: 'What is "Prompt Engineering"? (A) Building physical servers (B) Designing inputs to                 guide GenAI models to desired outputs (C) Writing Python code (D) Database indexing', b: 'Answer: B - The art of crafting inputs (prompts) to get the best results from LLMs.' },
            { f: 'Access a foundation model privately within your VPC. (A) Internet Gateway (B) VPC                 Endpoint (PrivateLink) (C) VPN (D) NAT Gateway', b: 'Answer: B - Use VPC Endpoints (PrivateLink) to connect to Bedrock/SageMaker APIs without                 traversing public internet.' },
            { f: 'Which role is responsible for ensuring AI systems are fair and unbiased? (A) Cloud                 Architect (B) AI Ethicist / Governance Lead (C) SysAdmin (D) DevOps', b: 'Answer: B - While everyone plays a part, AI Governance leads specifically focus on                 responsible AI practices.' },
            { f: 'Forecast future sales based on time-series data. (A) Personalize (B) Forecast (C)                 Textract (D) Polly', b: 'Answer: B - Amazon Forecast is a time-series forecasting service.' },
            { f: 'Which service can automatically create a video from a text script? (A) Rekognition                 (B) Bedrock (with video models) / Elemental (C) Transcribe (D) Connect', b: 'Answer: B - Bedrock (via models like Titan Image/Video or stable diffusion video                 variants) can generate content.' },
            { f: 'Optimize the cost of SageMaker training jobs by using spare capacity. (A) On-Demand                 (B) Managed Spot Training (C) Reserved Instances (D) Dedicated Hosts', b: 'Answer: B - Managed Spot Training uses Spot instances to reduce training costs by up to                 90%.' },
            { f: 'What is the "Temperature" setting of 0.0 likely to produce? (A) Highly random                 output (B) The most likely/deterministic output (C) No output (D) An error', b: 'Answer: B - 0 temperature makes the model deterministic (always picking the highest                 probability next token).' },
            { f: 'Analyze medical text for health information (PHI). (A) Comprehend Medical (B)                 Transcribe Medical (C) HealthLake (D) All of the above', b: 'Answer: D - These are all part of the AWS Health AI suite, but Comprehend Medical                 specifically extracts text entities from medical notes.' },
            { f: 'Which model type is "Titan"? (A) An AWS-built Foundation Model family (B) An                 open-source model (C) A database (D) A processor', b: 'Answer: A - Amazon Titan is AWS\\'s own family of FMs (Text, Embeddings, Image).' },
            { f: 'Automatically draft a response to a customer email. (A) Discriminative Model (B)                 Generative Model (LLM) (C) Regression Model (D) Clustering', b: 'Answer: B - Generative models (LLMs) are ideal for content creation tasks like email                 drafting.' },
            { f: 'Which is a visual tool to orchestrate ML workflows (Data prep, train, deploy)? (A)                 SageMaker Pipelines (B) Step Functions (C) CodePipeline (D) Glue', b: 'Answer: A - SageMaker Pipelines is a purpose-built CI/CD service for ML.' },
            { f: 'You need to enable your application to support conversational question answering                 based on *your* proprietary PDF manuals. (A) Train a new model (B) RAG (Retrieval Augmented Generation)                 (C) Fine-Tuning (D) Pre-training', b: 'Answer: B - RAG is the standard pattern for connecting an LLM to your own private data                 sources (Knowledge Base) without training.' },
            { f: 'A hospital needs to separate "PHI" (Personal Health Info) from other data in S3.                 (A) Macie (B) GuardDuty (C) Inspector (D) WAF', b: 'Answer: A - Macie is the service that automatically discovers, classifies, and protects                 sensitive data (PII/PHI) in S3.' },
            { f: 'Which Bedrock inference parameter limits the length of the generated response? (A)                 Stop Sequence (B) Max Tokens (C) Temperature (D) Top-P', b: 'Answer: B - "Max Tokens" (or Max Generation Length) defines the cutoff point for the                 generated output.' },
            { f: 'Business Analysts need to predict customer churn but don\\'t know Python. (A)                 SageMaker Studio (B) SageMaker Canvas (C) SageMaker JumpStart (D) EC2', b: 'Answer: B - SageMaker Canvas is explicitly designed for "No-Code" users (Business                 Analysts) to build ML models visually.' },
            { f: 'You want to generate images of "flying cars" using Bedrock. Which model family                 should you choose? (A) Claude (B) Titan Image Generator / Stable Diffusion (C) Jurassic-2 (D) Command', b: 'Answer: B - Titan Image Generator and Stable Diffusion are "Text-to-Image" models.                 Claude/Jurassic/Command are "Text-to-Text".' },
            { f: 'Which service helps you improve your application\\'s code security by scanning for                 hardcoded secrets? (A) Amazon Inspector (B) Amazon Q Developer (CodeWhisperer) (C) Macie (D) GuardDuty', b: 'Answer: B - Amazon Q Developer (formerly CodeWhisperer) has security scans that run in                 the IDE to find secrets/vulnerabilities.' },
            { f: 'What is the primary use case for "SageMaker JumpStart"? (A) Write code from scratch                 (B) One-click deploy of pre-trained models (C) Label data (D) Monitor bias', b: 'Answer: B - JumpStart provides a hub of pre-trained, open-source models (Hugging Face,                 etc.) that you can deploy with one click.' },
            { f: 'You need to verify if an FM is producing toxic content. Which evaluation method                 uses human reviewers? (A) Automatic Eval (B) Human Evaluation (C) Model Evaluation (D) Unit Testing', b: 'Answer: B - Human Evaluation involves real people reviewing the model\\'s outputs for                 toxicity, accuracy, and style.' },
            { f: 'A call center wants to analyze calls to see *why* customers are calling (Topic                 modeling). (A) Transcribe + Comprehend (B) Polly + Translate (C) Connect + Rekognition (D) Lex', b: 'Answer: A - Transcribe turns audio to text. Comprehend then analyzes that text to                 extract topics and sentiment.' },
            { f: 'Which vector engine option for OpenSearch is "Serverless"? (A) Provisioned (B)                 OpenSearch Serverless (C) EC2 (D) Aurora', b: 'Answer: B - Bedrock Knowledge Bases use "Amazon OpenSearch Serverless" to store vector                 embeddings without managing clusters.' },
            { f: 'You need to ensure your AI model cards document the intended use and limitations.                 This aligns with which Responsible AI pillar? (A) Transparency/Explainability (B) Security (C) Privacy                 (D) Performance', b: 'Answer: A - "Transparency" involves documenting how the model works, its intended use,                 and limitations (Model Cards).' },
            { f: 'Improve the "Chain of Thought" reasoning of a model by asking it to: (A) "Answer                 quickly" (B) "Think step-by-step" (C) "Be creative" (D) "Ignore context"', b: 'Answer: B - The phrase "Think step-by-step" is the classic trigger for Chain-of-Thought                 (CoT) prompting to improve logic.' },
            { f: 'Which service is a fully managed "Vector Database" compatible with MongoDB? (A)                 DocumentDB (with vector search) (B) DynamoDB (C) Neptune (D) RDS', b: 'Answer: A - DocumentDB (and also Atlas) now supports Vector Search for JSON documents.                 (Though OpenSearch is the primary RAG choice).' },
            { f: 'What is "Watermarking" in the context of Titan Image Generator? (A) Adding a                 visible logo (B) Adding an invisible signature to identify AI-generated images (C) Protecting the API                 (D) Billing tag', b: 'Answer: B - Titan adds an invisible watermark to generated images to help identify them                 as AI-generated (part of Responsible AI).' },
            { f: 'A startup wants to use Stable Diffusion but doesn\\'t want to manage servers. (A) EC2                 P3 instances (B) Amazon Bedrock (C) SageMaker Training (D) ECS', b: 'Answer: B - Bedrock offers Stable Diffusion (Stability AI) as a serverless API. No                 servers to manage.' },
            { f: 'You need to summarize a 100-page legal document. Which model feature is critical?                 (A) Image generation (B) Large Context Window (C) Low latency (D) Speech output', b: 'Answer: B - A Large Context Window (e.g. 100k+ tokens) is required to fit a 100-page                 document into the prompt for summarization.' },
            { f: 'Which IAM policy action is required to invoke a Bedrock model? (A)                 bedrock:ListModels (B) bedrock:InvokeModel (C) s3:GetObject (D) sagemaker:CreateEndpoint', b: 'Answer: B - `bedrock:InvokeModel` is the specific permission needed to run inference on                 a model.' },
            { f: 'An airline wants a chatbot that can actually *book* tickets by connecting to their                 legacy booking system. (A) Bedrock Agents (B) Bedrock Knowledge Base (C) SageMaker Canvas (D) Amazon                 Connect', b: 'Answer: A - "Agents" are designed to execute multi-step tasks and interact with external                 systems (APIs/Lambda).' },
            { f: 'Minimize latency for a real-time fraud detection model. (A) Asynchronous Inference                 (B) Real-time Inference (C) Batch Transform (D) Serverless Inference', b: 'Answer: B - "Real-time Inference" (persistent endpoint) offers the lowest, most                 consistent latency (ms). Serverless has cold starts.' },
            { f: 'Which tool helps non-experts perform "Feature Engineering" on raw data? (A)                 SageMaker Data Wrangler (B) SageMaker Debugger (C) SageMaker Edge (D) Bedrock', b: 'Answer: A - SageMaker Data Wrangler provides a UI to import, visualize, clean, and                 feature-engineer data with little/no code.' },
            { f: 'A developer wants to swap out an AI model (e.g. Claude to Llama) with minimal code                 changes. (A) Bedrock (B) SageMaker (C) EC2 (D) Lambda', b: 'Answer: A - Bedrock provides a unified API. Swapping models is often just changing the                 `modelId` parameter.' },
            { f: 'Detect "Drift" in a deployed model (accuracy degrading over time). (A) SageMaker                 Model Monitor (B) SageMaker Clarify (C) CloudTrail (D) Config', b: 'Answer: A - SageMaker Model Monitor continuously monitors production endpoints for data                 drift or model quality drift.' },
            { f: 'Which pricing component applies to Provisioned Throughput? (A) Per Token (B) Hourly                 commitment for Model Units (C) Per User (D) Free', b: 'Answer: B - Provisioned Throughput requires purchasing "Model Units" for a committed                 duration (1 month, 6 months) -> Hourly cost.' },
            { f: 'Identify distinct speakers in an audio recording ("Speaker Diarization"). (A) Polly                 (B) Transcribe (C) Translate (D) Rekognition', b: 'Answer: B - Amazon Transcribe supports "Speaker Diarization" to label who said what                 (Speaker A, Speaker B).' },
            { f: 'Your Bedrock Agent needs to access a Lambda function. What defines the API schema?                 (A) OpenAPI Schema (Swagger) / Action Group (B) Python script (C) IAM Policy (D) S3 Bucket', b: 'Answer: A - Agents use an OpenAPI schema (JSON) to understand the inputs/outputs of the                 Action Group (Lambda).' },
            { f: 'Which specialized search service allows querying data using natural language                 questions? (A) CloudSearch (B) Kendra (C) ElasticSearch (D) Athena', b: 'Answer: B - Kendra is specifically built for "Semantic Search" (understanding intent),                 unlike keyword-based search.' },
            { f: 'Company policy forbids sending PII to any AI model. How to enforce this centrally?                 (A) Bedrock Guardrails (B) Manual review (C) IAM Deny (D) VPC Endpoint', b: 'Answer: A - Bedrock Guardrails can be configured with a "Sensitive Information Filter"                 to block PII detection *before* it hits the model.' },
            { f: 'Amazon Q Business can connect to which data sources? (A) Only S3 (B) 40+ Enterprise                 connectors (Salesforce, ServiceNow, SharePoint, etc.) (C) Only Public Internet (D) Only DynamoDB', b: 'Answer: B - Amazon Q Business has built-in connectors for many enterprise data silos to                 power its chat RAG answer generation.' },
            { f: 'What is "In-Context Learning"? (A) Retraining the model (B) Including                 instructions/data/examples in the prompt itself (C) Updating weights (D) RAG', b: 'Answer: B - In-context learning relies on the prompt content (Context Window) to teach                 the model, without updating model weights.' },
            { f: '"Top-P" parameter in inference refers to: (A) The top probability token (B) Nucleus                 Sampling (cumulative probability cutoff) (C) Penalty (D) Pricing', b: 'Answer: B - Top-P (Nucleus Sampling) restricts the token choice to the top subset of                 tokens whose cumulative probability equals P (e.g. 0.9).' },
            { f: 'Which service helps you conduct a POC (Proof of Concept) for GenAI quickly? (A)                 Bedrock Playgrounds (B) EC2 (C) SageMaker Training Job (D) EKS', b: 'Answer: A - Bedrock Console "Playgrounds" allow you to instantly test prompts against                 different models (Chat, Text, Image) via UI.' },
            { f: 'Evaluate the "Correctness" of an RAG application. (A) RAGAS / Model Evaluation (B)                 CloudWatch (C) Cost Explorer (D) Latency metrics', b: 'Answer: A - Model Evaluation (in Bedrock) or frameworks like RAGAS measure                 "Faithfulness", "Answer Relevance", and "Context Recall".' },
            { f: 'You need to run a sentiment analysis job on 10 million documents overnight. (A)                 Real-time Endpoint (B) Asynchronous Inference (C) Batch Transform (D) Serverless Inference', b: 'Answer: C - Batch Transform is designed for offline processing of large datasets where                 latency doesn\\'t matter.' },
            { f: 'Which model is "Multi-Modal"? (A) Titan Text Embeddings (B) Claude 3 Sonnet (C)                 Polly (D) Translate', b: 'Answer: B - Claude 3 (and Titan Multimodal Embeddings) can understand/process both Text                 AND Images (Vision).' },
            { f: 'Reduce the size and latency of a model for mobile deployment without losing much                 accuracy. (A) Pruning / Quantization (SageMaker Neo) (B) Training longer (C) Increasing layers (D) RAG', b: 'Answer: A - Quantization (reducing precision from float32 to int8) and Pruning are                 compilation techniques used by SageMaker Neo.' },
            { f: 'Security team requires all Bedrock API calls to be logged for audit. (A) CloudTrail                 (B) CloudWatch Metrics (C) VPC Flow Logs (D) GuardDuty', b: 'Answer: A - CloudTrail logs the API activity (who, when, what) for `InvokeModel`                 management events (and data events if enabled).' },
            { f: 'What is the "Landing Zone" for an Agent? (A) Where it saves files (B) The prompt                 (C) There isn\\'t one (D) The final response', b: 'Answer: C - Agents don\\'t have a "Landing Zone". (Trick question concepts from Control                 Tower or S3). Agents have "Action Groups".' },
            { f: 'Provide a natural language interface for querying a SQL database (Text-to-SQL). (A)                 Bedrock / Q (B) RDS (C) DynamoDB (D) ElastiCache', b: 'Answer: A - Generative AI (Bedrock Knowledge Bases or simple prompt engineering) enables                 Text-to-SQL generation.' },
            { f: 'Which feature allows you to "Continuously Pre-train" a model with unlabeled data?                 (A) Fine-tuning (B) Continued Pre-training (Bedrock custom models) (C) RAG (D) Agents', b: 'Answer: B - Continued Pre-training (Domain Adaptation) uses huge amounts of *unlabeled*                 data to teach the model a new domain (e.g. medical/financial jargon).' },
            { f: 'What is the role of the "Orchestrator" in a Bedrock Agent? (A) It runs the Lambda                 (B) It breaks down the user request into logical steps (Chain-of-Thought) (C) It stores data (D) It pays                 the bill', b: 'Answer: B - The fully managed Agent Orchestrator analyzes the prompt, breaks it into                 tasks, and decides which Action Group/KB to call.' },
            { f: 'Which AWS service offers "Clinical" NLP features? (A) Amazon Comprehend Medical (B)                 Amazon HealthLake (C) Both A and B (D) None', b: 'Answer: C - Comprehend Medical extracts entities. HealthLake stores/queries FHIR data                 and uses NLP integrated inside it.' },
            { f: 'Your model output is cut off in mid-sentence. Why? (A) Temperature too high (B) Max                 Tokens limit reached (C) Invalid API key (D) Internet failure', b: 'Answer: B - If the generation hits the `max_tokens` (or `max_gen_len`) limit, it stops                 abruptly.' },
            { f: 'Can you use Amazon Bedrock in a "Disconnected" (Offline) environment? (A) Yes,                 download the model (B) No, it\\'s a managed cloud service (C) Only with Outposts (D) Only with Snowball', b: 'Answer: B - Bedrock is a regional, cloud-based API service. You cannot download the                 weights to run offline (unlike SageMaker JumpStart where you might).' },
            { f: 'What is "Prompt Injection"? (A) A speed optimization (B) A security attack where                 malicious inputs trick the model provided (C) A database query (D) A deployment method', b: 'Answer: B - Prompt Injection is an adversarial attack to override the system                 instructions effectively "hijacking" the model.' },
            { f: 'A developer needs to extract data from a scanned driver\\'s license. (A) Textract                 AnalyzeID (B) Rekognition (C) Transcribe (D) Translate', b: 'Answer: A - Textract has a specialized API `AnalyzeID` for identity documents                 (Passports, Licenses).' },
            { f: 'You are using Amazon Q within the AWS Console. What can it do? (A) Troubleshoot                 errors (B) Suggest infrastructure (C) Chat about documentation (D) All of the above', b: 'Answer: D - Amazon Q in the console is an expert assistant for troubleshooting,                 architecture suggestions, and docs lookup.' },
            { f: 'Which technique reduces the risk of "Model Hallucination"? (A) Increasing                 Temperature (B) RAG (Retrieval Augmented Generation) (C) Decreasing Max Tokens (D) Zero-shot', b: 'Answer: B - RAG grounds the model in factual data retrieved from a trusted source,                 significantly reducing hallucinations.' },
            { f: 'What is the inputs and outputs format for most Bedrock models? (A) SQL (B) JSON (C)                 XML (D) Binary', b: 'Answer: B - The `InvokeModel` API expects a JSON payload (prompt, parameters) and                 returns a JSON response.' },
            { f: 'Which service is best for "Predictive Maintenance"? (A) Amazon Monitron (B) Amazon                 Personalize (C) Amazon Lex (D) Amazon Poly', b: 'Answer: A - Monitron (hardware sensors + service) allows detecting abnormal machine                 behavior (vibration/temp) to predict failures.' },
            { f: 'A data scientist wants to share their ML model with other teams securely. (A)                 SageMaker Model Registry (B) Email (C) S3 public bucket (D) USB drive', b: 'Answer: A - SageMaker Model Registry tracks model versions, approval status, and                 metadata for governance and sharing.' },
            { f: 'Which AI concept involves "Giving the model a persona"? (A) System Prompting (B)                 Temperature (C) Embeddings (D) Fine-tuning', b: 'Answer: A - System Prompts (or System Instructions) set the behavior/persona of the                 model (e.g. "You are a helpful banking assistant").' },
            { f: 'Why use Amazon Bedrock "Batch Inference"? (A) For real-time chat (B) To process                 large volumes of prompts asynchronously at lower cost/urgency (C) For higher latency (D) For video                 streaming', b: 'Answer: B - Batch Inference is for processing millions of prompts (e.g. summarizing huge                 archives) where immediate response isn\\'t needed.' },
        ];
        
        let currentIndex = 0;
        const frontEl = document.getElementById('card-front');
        const backEl = document.getElementById('card-back');
        const innerEl = document.getElementById('card-inner');
        const counterEl = document.getElementById('counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateCard() {
            frontEl.textContent = cards[currentIndex].f;
            backEl.textContent = cards[currentIndex].b;
            counterEl.textContent = `${currentIndex + 1} / ${cards.length}`;
            innerEl.classList.remove('is-flipped');
        }

        document.getElementById('card').addEventListener('click', () => {
            innerEl.classList.toggle('is-flipped');
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < cards.length - 1) {
                currentIndex++;
                updateCard();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        });

        // Initialize
        updateCard();
    </script>
