<body>
    <div class="container">
        <a href="../../index.html" class="btn">← Back to Dashboard</a>
        <h1>AWS Cloud Practitioner</h1>
        <h2>Flashcards</h2>
        <div class="flashcard-container" id="fc-container">
            <div class="flashcard" id="card">
                <div class="card-inner" id="card-inner">
                    <div class="card-front" id="card-front">Loading...</div>
                    <div class="card-back" id="card-back">Loading...</div>
                </div>
            </div>
        </div>
        
        <div class="fc-controls">
            <button class="btn" id="prev-btn">← Prev</button>
            <span id="counter" style="color:#aaa; font-family:monospace; padding:0 15px;">1 / 1</span>
            <button class="btn" id="next-btn">Next →</button>
        </div>
    </div>

    <script>
        const cards = [
            { f: 'A company needs to host a static website with the lowest possible cost. (A) EC2 with                 ALB (B) S3 Bucket (C) ECS Fargate (D) RDS', b: 'Answer: B - S3 Static Website Hosting is the most cost-effective and scalable solution                 for static content.' },
            { f: 'Which DB service is best for a high-traffic e-commerce shopping cart needing                 single-digit ms latency? (A) RDS MySQL (B) DynamoDB (C) Redshift (D) Neptune', b: 'Answer: B - DynamoDB is high-performance NoSQL, perfect for key-value data like shopping                 carts with millisecond latency.' },
            { f: 'You need to store archived data for 7 years to meet compliance, access time can be                 12 hours. (A) S3 Standard (B) S3 Glacier Instant Retrieval (C) S3 Deep Archive (D) S3                 Intelligent-Tiering', b: 'Answer: C - Deep Archive is lowest cost for long-term retention where retrieval time of                 12+ hours is acceptable.' },
            { f: 'Application EC2 instances are in a private subnet. They need to download updates                 from internet. (A) Internet Gateway (B) NAT Gateway (C) Egress-Only Internet Gateway (D) VPS Peering', b: 'Answer: B - NAT Gateway allow private instances to initiate outbound IPv4 traffic to                 internet but blocks inbound.' },
            { f: 'You want to decouple an image processing system. Uploads should trigger processing                 asynchronously. (A) Direct EC2 call (B) SQS + Lambda (C) RDS trigger (D) ALB sticky sessions', b: 'Answer: B - S3 event -> SQS queue -> Lambda consumer is a classic decoupled, serverless                 pattern.' },
            { f: 'Files need to be accessible by multiple Linux EC2 instances simultaneously across                 AZs. (A) EBS (B) EFS (C) Instance Store (D) S3 Glacier', b: 'Answer: B - EFS (Elastic File System) provides a shared NFS file system for Linux                 instances across AZs.' },
            { f: 'A global application needs users to be routed to the nearest AWS region with low                 latency. (A) Route 53 Geolocation (B) CloudFront (C) AWS Global Accelerator (D) VPN', b: 'Answer: C - Global Accelerator uses AWS global network and static IPs to route to                 optimal endpoint. (Route 53 Geolocation also works but GA is often preferred for TCP/UDP performance).' },
            { f: 'You need a data warehouse to analyze petabytes of data using SQL. (A) RDS (B)                 DynamoDB (C) Redshift (D) ElastiCache', b: 'Answer: C - Redshift is AWS\\'s petabyte-scale data warehouse solution (OLAP).' },
            { f: 'Manage encryption keys for AWS services and control rotation. (A) AWS Artifact (B)                 KMS (C) Secrets Manager (D) Shield', b: 'Answer: B - KMS (Key Management Service) is used to create and manage cryptographic                 keys.' },
            { f: 'Temporary access to S3 objects for mobile users without embedding credentials. (A)                 IAM User (B) S3 Bucket Policy (C) Cognito Identity Pool / Presigned URLs (D) NACL', b: 'Answer: C - Cognito Identity Pools or Presigned URLs allow temporary, secure access for                 unauthenticated or federated users.' },
            { f: 'Securely store database credentials and rotate them automatically. (A) KMS (B)                 Parameter Store (C) Secrets Manager (D) S3 Encrypted', b: 'Answer: C - Secrets Manager supports automatic rotation of secrets (DB credentials),                 Parameter Store does not rotate natively without Lambda.' },
            { f: 'Ensure an EBS volume can be recovered in another region for DR. (A) Take Snapshot                 -> Copy to Region (B) Unmount and Move (C) Use TGW (D) VPC Peering', b: 'Answer: A - You make a snapshot, and then copy that snapshot to the target region to                 restore a volume there.' },
            { f: 'Restrict access to an S3 bucket to only traffic coming from a specific VPC                 Endpoint. (A) Security Group (B) Bucket Policy with aws:sourceVpce condition (C) NACL (D) IAM Role', b: 'Answer: B - Bucket Policies can deny requests that don\\'t come from a specific VPC                 Endpoint ID.' },
            { f: 'Run a containerized application with no server management. (A) EC2 (B) Fargate (C)                 ECS on EC2 (D) EKS on EC2', b: 'Answer: B - AWS Fargate is the serverless compute engine for containers (ECS/EKS).' },
            { f: 'Migrate an on-premise Oracle DB to Aurora PostgreSQL with minimal downtime. (A)                 Dump and Restore (B) AWS DMS (Database Migration Service) with SCT (C) DataSync (D) Snowball', b: 'Answer: B - DMS handles data replication for minimal downtime; SCT (Schema Conversion                 Tool) converts the schema.' },
            { f: 'Protect a web application from SQL injection and XSS attacks. (A) Security Groups                 (B) WAF (Web Application Firewall) (C) Shield Standard (D) GuardDuty', b: 'Answer: B - WAF allows you to inspect traffic at Layer 7 and block SQLi, XSS, etc.' },
            { f: 'High performance file system for Lustre (HPC) workloads. (A) EFS (B) FSx for Lustre                 (C) S3 (D) EBS io2', b: 'Answer: B - FSx for Lustre is optimized for compute-intensive workloads (HPC, ML).' },
            { f: 'Route traffic based on user location to a specific version of the website (e.g.                 French). (A) Latency Routing (B) Geolocation Routing (C) Weighted Routing (D) Failover Routing', b: 'Answer: B - Geolocation routing lets you route traffic based on the geographic location                 of the request.' },
            { f: 'Monitor EC2 memory usage. (A) CloudWatch Default Metrics (B) CloudTrail (C)                 CloudWatch Custom Metric (Unified Agent) (D) Config', b: 'Answer: C - Memory is NOT a default EC2 metric (Hypervisor doesn\\'t see inside OS). You                 need the CloudWatch Agent.' },
            { f: 'Send email notifications to admins when CPU > 80%. (A) CloudWatch Alarm -> SNS (B)                 CloudTrail -> S3 (C) EventBridge -> Lambda (D) VPC Flow Logs', b: 'Answer: A - CloudWatch Alarm monitors the metric and publishes to an SNS topic which                 emails subscribers.' },
            { f: 'Connect an on-premise data center to VPC using private dedicated connection. (A)                 VPN (B) Direct Connect (C) Internet Gateway (D) VPC Peering', b: 'Answer: B - Direct Connect (DX) is a dedicated physical fiber link, avoiding the public                 internet.' },
            { f: 'Automate creation of AWS infrastructure using code. (A) CloudFormation (B)                 CodeBuild (C) Config (D) Systems Manager', b: 'Answer: A - CloudFormation (or Terraform/CDK) enables Infrastructure as Code (IaC).' },
            { f: 'Which service helps you check service limits (quotas) and trusted advisor checks?                 (A) AWS Trusted Advisor (B) Service Quotas (C) Inspector (D) Artifact', b: 'Answer: A - Trusted Advisor checks for cost, performance, security, and service limits.' },
            { f: 'A single fixed IP address is needed for whitelisting by a 3rd party API, but you                 have ASG in private subnets. (A) Private IP (B) NAT Gateway IP (C) EIP on Instances (D) ALB IP', b: 'Answer: B - Traffic from private instances goes through the NAT Gateway, which has a                 static Elastic IP (EIP) you can whitelist.' },
            { f: 'Requirement for "Read after Write" consistency for new objects. (A) DynamoDB (B)                 EFS (C) S3 (D) ElastiCache', b: 'Answer: C - S3 now provides strong read-after-write consistency for all object                 operations (PUTs and DELETEs).' },
            { f: 'Process real-time streaming data (clickstream). (A) SQS (B) Kinesis Data Streams                 (C) Glacier (D) Batch', b: 'Answer: B - Kinesis is designed for real-time big data streaming ingestion.' },
            { f: 'Run a SQL query directly on JSON data sitting in S3 without loading it. (A)                 Redshift (B) Athena (C) Aurora (D) Glue', b: 'Answer: B - Amazon Athena is a serverless query service to analyze data in S3 using                 standard SQL.' },
            { f: 'Fastest way to transfer 500 TB of data to AWS where internet is slow. (A) VPN (B)                 Snowball Edge (C) Multipart Upload (D) Direct Connect', b: 'Answer: B - Snowball / Snowmobile is faster for massive data transfer when bandwidth is                 limited (Sneakernet).' },
            { f: 'Ensure RDS database is encrypted. (A) Enable encryption at creation (B) Encrypt via                 OS (C) Use SSL (D) S3 Replication', b: 'Answer: A - RDS encryption (using KMS) must be defined at instance/volume creation time                 (or by copying snapshot as encrypted).' },
            { f: 'Control traffic at the subnet level (Stateless firewall). (A) Security Group (B)                 NACL (Network ACL) (C) WAF (D) Route Table', b: 'Answer: B - NACLs are stateless and operate at the subnet boundary. Security Groups are                 stateful and operate at the ENI/Instance level.' },
            { f: 'Provide desktop-as-a-service (DaaS) to employees. (A) Workspace (B) AppStream 2.0                 (C) EC2 (D) Connect', b: 'Answer: A - Amazon WorkSpaces is a managed, secure Desktop-as-a-Service (DaaS) solution.' },
            { f: 'Analyze logs for potential threats (e.g. crypto mining, unusual API calls). (A)                 Inspector (B) Macie (C) GuardDuty (D) Shield', b: 'Answer: C - GuardDuty is an intelligent threat detection service that analyzes                 CloudTrail, VPC Flow Logs, and DNS logs.' },
            { f: 'Store credit card data (PCI-DSS) with dedicated hardware requirement. (A) Dedicated                 Instances (B) Dedicated Hosts (C) Spot Instances (D) Reserved Instances', b: 'Answer: B - Dedicated Hosts provide physical server visibility and affinity, often                 required for strict compliance/licensing.' },
            { f: 'Distribute incoming application traffic across multiple targets in multiple AZs.                 (A) Auto Scaling (B) ELB (Elastic Load Balancer) (C) Route 53 (D) CloudFormation', b: 'Answer: B - ELK/ALB/NLB distributes traffic to healthy targets.' },
            { f: 'Cache dynamic API responses to reduce load on DB. (A) CloudFront (B) ElastiCache                 (C) S3 (D) DAX', b: 'Answer: B - ElastiCache (Redis/Memcached) is used to cache DB queries/sessions. DAX is                 specifically for DynamoDB.' },
            { f: 'Serverless orchestration of workflows (state machine). (A) Lambda (B) Step                 Functions (C) Batch (D) SQS', b: 'Answer: B - Step Functions lets you coordinate multiple AWS services into serverless                 workflows (State Machine).' },
            { f: 'Identify PII (Personally Identifiable Information) in S3 buckets. (A) GuardDuty (B)                 Macie (C) Inspector (D) Shield', b: 'Answer: B - Amazon Macie uses ML to discover and protect sensitive data (PII) in S3.' },
            { f: 'Block a specific IP address from accessing your subnet. (A) Security Group (B) NACL                 (C) IAM Policy (D) Route 53', b: 'Answer: B - Only NACLs support "DENY" rules. Security Groups are "ALLOW" only.' },
            { f: 'Long-term storage for backup tapes replacement. (A) S3 Standard (B) Storage Gateway                 Tape Gateway (C) EBS Snapshots (D) Snowball', b: 'Answer: B - Tape Gateway (VTL) allows you to keep using existing backup software but                 store "tapes" in S3/Glacier.' },
            { f: 'Access AWS services from a VPC without traffic traversing the public internet. (A)                 VPC Endpoint (PrivateLink) (B) NAT Gateway (C) IGW (D) VPN', b: 'Answer: A - VPC Endpoints allow private connections to supported AWS services (S3,                 DynamoDB, API Gateway, etc.).' },
            { f: 'Mount a filesystem to an EC2 instance that is high performance and temporary                 (cache). (A) EBS (B) Instance Store (Ephemeral) (C) EFS (D) S3', b: 'Answer: B - Instance Store is physically attached to the host (fastest) but data is lost                 on stop/terminate. Great for cache/buffers.' },
            { f: 'Which ALB feature allows routing based on the URL path (e.g. /images vs /api)? (A)                 Host-based routing (B) Path-based routing (C) Query string routing (D) Geo routing', b: 'Answer: B - Path-based routing allows directing traffic to different target groups based                 on URL path.' },
            { f: 'Optimize costs for steady-state usage EC2 running 24/7 for 3 years. (A) Spot                 Instances (B) On-Demand (C) Reserved Instances / Savings Plans (D) Dedicated Hosts', b: 'Answer: C - RIs or Savings Plans offer significant (up to 72%) discounts for committed                 usage.' },
            { f: 'Deploy code changes automatically when pushed to a repo, run tests, and deploy. (A)                 CodeCommit (B) CodePipeline (C) CloudTrail (D) X-Ray', b: 'Answer: B - CodePipeline orchestrates the CI/CD stages (Source -> Build -> Deploy).' },
            { f: 'Centralize and view logs from all EC2 instances and Lambda functions. (A)                 CloudWatch Logs (B) S3 (C) CloudTrail (D) VPC Flow Logs', b: 'Answer: A - CloudWatch Logs centralizes log streams from various sources.' },
            { f: 'Trace user requests as they travel through microservices architecture. (A)                 CloudWatch (B) X-Ray (C) Inspector (D) Ping', b: 'Answer: B - AWS X-Ray helps developers analyze and debug production, distributed                 applications (tracing).' },
            { f: 'Automatically rotate secrets for RDS. (A) Secrets Manager (B) Systems Manager                 Parameter Store (C) KMS (D) IAM', b: 'Answer: A - Secrets Manager has native built-in rotation integration for RDS.' },
            { f: 'Improve read performance of a database receiving many SELECT queries. (A) Multi-AZ                 (B) Read Replicas (C) Sharding (D) Larger Instance', b: 'Answer: B - Read Replicas allow you to offload read traffic from the primary instance.                 Multi-AZ is for HA/DR, not performance.' },
            { f: 'A legacy application requires multicast networking support. (A) VPC with Multicast                 Hub (B) Transit Gateway (C) Direct Connect (D) VPN', b: 'Answer: B - AWS Transit Gateway is the only service that natively supports IP multicast.' },
            { f: 'You need to store objects. Data must be resilient if an entire AZ is destroyed, but                 cost is critical. (A) S3 One Zone-IA (B) S3 Standard-IA (C) S3 Standard (D) EBS', b: 'Answer: B - S3 Standard-IA stores data across 3+ AZs (resilient to AZ loss) but is                 cheaper than Standard. One Zone-IA dies with the AZ.' },
            { f: 'EC2 instance needs to access S3 bucket in another account. (A) IAM Role on Instance                 + Bucket Policy in other account (B) Access Keys (C) VPC Peering (D) Copy data', b: 'Answer: A - Cross-account access requires an IAM Role in the source and a Bucket Policy                 in the destination granting access to that Role.' },
            { f: 'Secure a highly sensitive DB. Ensure admins cannot delete the DB instances                 accidentally or maliciously. (A) MFA Delete (B) IAM Condition (C) Service Control Policy (SCP) (D)                 Deletion Protection', b: 'Answer: D - Enabling "Deletion Protection" on the RDS instance prevents it from being                 deleted until the flag is unchecked.' },
            { f: 'A user has a Policy allowing "S3:*" but is part of a Group with a Policy "Deny                 S3:DeleteObject". Effect? (A) Allowed (B) Denied (C) Prompted (D) Error', b: 'Answer: B - Explicit DENY always trumps ALLOW.' },
            { f: 'Company requires all EBS volumes to be encrypted. How to enforce this for new                 volumes? (A) CloudWatch Event (B) IAM Policy (C) EBS Encryption by Default (Account Setting) (D) Lambda', b: 'Answer: C - Enabling "EBS Encryption by Default" in the EC2 dashboard ensures every new                 volume created in that region is encrypted.' },
            { f: 'Website uses CloudFront. You need to geo-restrict content to US only. (A) Route 53                 (B) WAF (C) CloudFront Geo Restriction (D) S3 Bucket Policy', b: 'Answer: C - CloudFront has a native "Geo Restriction" (whitelist/blacklist) feature.' },
            { f: 'DB layer needs auto-scaling for *read* traffic. (A) Multi-AZ (B) Read Replicas +                 Aurora Auto Scaling (C) Larger Instance (D) Sharding', b: 'Answer: B - Amazon Aurora can automatically add/remove Read Replicas based on                 CPU/Connections logic.' },
            { f: 'Which service provides a shared file system for Windows servers? (A) EFS (B) FSx                 for Windows File Server (C) S3 (D) Storage Gateway', b: 'Answer: B - FSx for Windows File Server provides fully managed native Microsoft Windows                 file systems (SMB).' },
            { f: 'Connect 100 VPCs together. VPC Peering is becoming a mesh nightmare. (A) Transit                 Gateway (B) Direct Connect (C) VPN Hub (D) VPC Endpoints', b: 'Answer: A - Transit Gateway (TGW) acts as a central hub (router) to connect thousands of                 VPCs and on-prem networks.' },
            { f: 'Disaster Recovery: RPO/RTO can be minutes. Low cost is not primary driver. (A)                 Backup & Restore (B) Pilot Light (C) Warm Standby (D) Multi-Region Active-Passive', b: 'Answer: C - Warm Standby implies a scaled-down version is always running, allowing                 faster failover than Pilot Light (minutes).' },
            { f: 'You need to run a script once a day for 10 minutes. (A) EC2 Reserved (B) EC2 Spot                 (C) Lambda (if < 15min) (D) EventBridge Scheduler + Lambda', b: 'Answer: D - EventBridge Scheduler triggers the Lambda function daily. Lambda is                         perfect for short, scheduled tasks.' },
            { f: 'Protect S3 data from accidental deletion/overwrites. (A) Replication (B)                     Versioning (C) Encryption (D) MFA', b: 'Answer: B - S3 Versioning keeps multiple variants of an object. If you delete, it                     inserts a delete marker, which can be undone.' },
            { f: 'Application needs extreme performance storage (100,000 IOPS) on EC2. (A) gp3                     (B) io2 Block Express (C) st1 (D) sc1', b: 'Answer: B - io2 Block Express is the highest performance EBS volume type, designed                     for mission-critical sub-millisecond latency.' },
            { f: 'Share a specific S3 object with a user for 10 minutes only. (A) IAM Role (B)                     Presigned URL (C) Bucket Policy (D) ACL', b: 'Answer: B - Presigned URLs grant temporary access to a specific private object.' },
            { f: 'What is the difference between Security Group (SG) and NACL? (A) SG is                     Stateless, NACL is Stateful (B) SG is Stateful, NACL is Stateless (C) No difference (D) SG works at                     VPC level', b: 'Answer: B - Security Groups are Stateful (return traffic allowed auto). NACLs are                     Stateless (must allow return explicitly).' },
            { f: 'Decrypt data inside an EC2 instance (enclave) securely. (A) KMS (B) Nitro                     Enclaves (C) CloudHSM (D) Macie', b: 'Answer: B - AWS Nitro Enclaves create isolated compute environments to protect                     highly sensitive data during processing.' },
            { f: 'Host a static website using custom domain and HTTPS. (A) S3 + Route 53 (B) S3 +                     CloudFront + ACM (C) EC2 + Apache (D) Lightsail', b: 'Answer: B - S3 by itself supports HTTP. For HTTPS with a custom domain, you MUST                     front it with CloudFront and use an ACM certificate.' },
            { f: 'Monitor for PII data leaking into a bucket. (A) Macie (B) GuardDuty (C)                     Inspector (D) WAF', b: 'Answer: A - Macie is the data security service that discovers sensitive data (PII,                     PHI) in S3.' },
            { f: 'EC2 in private subnet needs to access S3. Compliance says "Traffic must NOT                     leave Amazon network". (A) NAT Gateway (B) VPC Endpoint (Gateway) (C) Internet Gateway (D) VPN', b: 'Answer: B - Gateway Endpoint for S3 routes traffic privately within AWS network. NAT                     Gateway would work but traffic leaves subnet to NAT (though still in AWS, Endpoint is strictly                     private routing).' },
            { f: 'High Velocity data ingestion (IoT sensors). (A) SQS (B) Kinesis Data Streams                     (C) SNS (D) S3', b: 'Answer: B - Kinesis Data Streams is built for massive ingestion of real-time data                     streams.' },
            { f: '"Fan-out" architecture: One message needs to trigger a Lambda, an Email, and an                     SQS queue. (A) SQS (B) SNS (C) Kinesis (D) Step Functions', b: 'Answer: B - SNS (Simple Notification Service) is Pub/Sub. You publish once, and it                     "fans out" to all subscribers (Lambda, Email, SQS).' },
            { f: 'Cost effective DB for purely key-value lookups, millions/sec. (A) RDS (B)                     DynamoDB (C) Redshift (D) Neptune', b: 'Answer: B - DynamoDB is the choice for high-scale, key-value workloads.' },
            { f: 'Prevent users from disabling CloudTrail logs in a specific account in an                     Organization. (A) IAM Policy (B) Service Control Policy (SCP) (C) CloudWatch Alarm (D) Config Rule', b: 'Answer: B - SCPs (Organization level) act as guardrails. A Deny on                     "cloudtrail:StopLogging" in SCP prevents ANY user (even root) in the account from doing it.' },
            { f: 'Global application. Writes go to US-East, Reads happen locally in Europe/Asia.                     (A) RDS Multi-AZ (B) Aurora Global Database (C) DynamoDB Global Tables (D) S3 Replication', b: 'Answer: B - Aurora Global DB allows a primary writer in one region and low-latency                     read replicas in others.' },
            { f: 'Limit the max number of requests from a single IP to your API. (A) Shield (B)                     WAF Rate-based Rule (C) NACL (D) Security Group', b: 'Answer: B - AWS WAF supports "Rate-based rules" to block IPs that exceed a threshold                     (e.g. 2000 req/5min).' },
            { f: 'You need to ensure an EC2 instance is placed on a distinct physical rack. (A)                     Cluster Placement Group (B) Spread Placement Group (C) Partition Placement Group (D) Dedicated Host', b: 'Answer: B - Spread Placement Groups strictly place each instance on a separate rack.                     (Partition distributes across groups of racks).' },
            { f: 'A company wants to prevent ANY public access to S3 buckets at the account                     level. (A) Bucket Policy (B) S3 Block Public Access (C) IAM (D) NACL', b: 'Answer: B - S3 Block Public Access can be configured at the Account level to                     override any bucket/object permissions.' },
            { f: 'Store JSON documents, flexible schema, query by any attribute. (A) S3 (B)                     DynamoDB (C) DocumentDB (D) RDS', b: 'Answer: C - Amazon DocumentDB is MongoDB-compatible and designed specifically for                     JSON document storage/querying.' },
            { f: 'Transfer 50 TB data from on-prem to S3 over internet is too slow. VPN is flaky.                     (A) Direct Connect public VIF (B) AWS Snowball Edge Storage Optimized (C) Site-to-Site VPN (D)                     Database Migration Service', b: 'Answer: B - For 50TB with poor connectivity, physical transfer via Snowball is the                     standard recommendation.' },
            { f: 'Which Load Balancer is best for millions of requests/sec with ultra-low latency                     (TCP/UDP)? (A) ALB (B) NLB (C) CLB (D) GWLB', b: 'Answer: B - Network Load Balancer (NLB) operates at Layer 4 and handles millions of                     requests/sec with extremely low latency.' },
            { f: 'Grant an EC2 instance permissions to upload to S3. (A) Store keys in code (B)                     IAM User (C) IAM Role attached to Instance Profile (D) Bucket Policy', b: 'Answer: C - Never store keys on EC2. Attach an IAM Role.' },
            { f: 'Authenticate users for your ALB-fronted app using Google/Facebook. (A) Cognito                     User Pools (B) IAM (C) Directory Service (D) Shield', b: 'Answer: A - ALB integrates natively with Amazon Cognito to handle OIDC/SAML                     authentication.' },
            { f: 'Run a short task (30s) every time an object is uploaded to S3. (A) EC2 (B)                     Lambda (C) ECS (D) AppRunner', b: 'Answer: B - S3 Event Notifications triggering Lambda is the most efficient,                     cost-effective serverless pattern.' },
            { f: '"Serverless" SQL database that scales down to zero when not used. (A) RDS MySQL                     (B) Aurora Serverless (C) DynamoDB (D) Redshift Serverless', b: 'Answer: B - Aurora Serverless v2 scales capacity up/down instantly; v1 can pause                     (scale to zero).' },
            { f: 'Coordinate microservices where some steps might take hours (human approval).                     (A) Lambda (B) Step Functions (C) SQS (D) SNS', b: 'Answer: B - Step Functions "Standard Workflows" can run for up to 1 year, perfect                     for human approval steps (callbacks).' },
            { f: 'Audit configuration changes to AWS resources over time. (A) CloudTrail (B)                     Config (C) CloudWatch (D) Inspector', b: 'Answer: B - AWS Config records the *configuration state* of resources (timeline of                     changes), whereas CloudTrail records API *calls*.' },
            { f: 'Centralized DNS management for multiple VPCs. (A) Route 53 Resolver (B) Host                     files (C) AD Connector (D) Direct Connect', b: 'Answer: A - Route 53 Resolver (Outbound/Inbound endpoints) manages DNS between VPCs                     and on-premise networks.' },
            { f: 'Encrypt an existing unencrypted DB snapshot. (A) You can\\'t (B) Copy the                     snapshot and check "Encrypt" (C) Modify the snapshot settings (D) Use S3', b: 'Answer: B - You cannot encrypt an existing snapshot in place. You must copy it and                     enable encryption on the copy.' },
            { f: 'Which Route 53 policy for Active-Passive failover? (A) Weighted (B) Failover                     (C) Latency (D) Geolocation', b: 'Answer: B - Failover routing policy is for Active-Passive (Primary -> Secondary if                     Primary unhealthy).' },
            { f: 'Improve performance for users downloading large files from S3 across the globe.                     (A) S3 Transfer Acceleration (B) Direct Connect (C) VPN (D) Multipart Upload', b: 'Answer: A - S3 Transfer Acceleration uses CloudFront edge locations to route data to                     S3 faster over the AWS backbone.' },
            { f: 'Securely access Linux instances without opening Port 22 (SSH). (A) Systems                     Manager Session Manager (B) EC2 Instance Connect (C) Putty (D) Bastion Host', b: 'Answer: A - Session Manager allows browser-based shell access via IAM, logging                     commands to CloudWatch/S3, with NO inbound ports needed.' },
            { f: 'What is the SLA for S3 Standard Durability? (A) 99.9% (B) 99.99% (C) 11 9s                     (99.999999999%) (D) 100%', b: 'Answer: C - 11 9s of Durability (not to be confused with Availability, which is                     99.99%).' },
            { f: 'Application needs a Graph Database. (A) DynamoDB (B) Neptune (C) RDS (D)                     Timestream', b: 'Answer: B - Amazon Neptune is the managed Graph Database service (Gremlin/SPARQL).' },
            { f: 'Store Time-Series data (IoT telemetry). (A) DynamoDB (B) Timestream (C) RDS (D)                     QLDB', b: 'Answer: B - Amazon Timestream is a serverless time-series database.' },
            { f: 'You need an immutable ledger for banking transactions. (A) Blockchain (B) QLDB                     (Quantum Ledger DB) (C) RDS (D) DynamoDB', b: 'Answer: B - QLDB provides a transparent, immutable, cryptographically verifiable                     transaction log.' },
            { f: 'Accelerate UDP traffic for online gaming globally. (A) CloudFront (B) Global                     Accelerator (C) Route 53 (D) Direct Connect', b: 'Answer: B - Global Accelerator supports TCP/UDP and works well for non-HTTP gaming                     use cases. CloudFront is HTTP/S.' },
            { f: 'Identify underutilized EC2 instances to save money. (A) Cost Explorer (B)                     Trusted Advisor / Compute Optimizer (C) Budgets (D) CloudTrail', b: 'Answer: B - Trusted Advisor and Compute Optimizer specifically recommend rightsizing                     for underutilized resources.' },
            { f: 'Mount S3 bucket as a local drive? (A) Not native (B) File Gateway (C) Volume                     Gateway (D) Tape Gateway', b: 'Answer: B - File Gateway exposes S3 as an NFS/SMB share. (Mountpoint for S3 is a                     newer agent, but File Gateway is the classic infrastructure answer).' },
            { f: 'Difference between SQS Standard and FIFO? (A) FIFO is cheaper (B) Standard                     guarantees order (C) FIFO guarantees order and exactly-once processing (D) Standard is slower', b: 'Answer: C - FIFO = First In First Out (Strict Order) + Exactly-Once. Standard = Best                     Effort order + At-Least-Once (duplicates possible).' },
            { f: 'You need to pre-warm an ALB for a massive spike (Flash Sale). (A) It happens                     auto (B) Contact AWS Support (C) Use NLB (D) Adding instances', b: 'Answer: B - While ALBs scale, for *instant* massive spikes, you should contact AWS                     Support to pre-warm the load balancer heat.' },
            { f: 'Best practice for Root User? (A) Use it daily (B) Create Access Keys for it                     (C) Lock it away (MFA), delete keys, use only for account tasks (D) Share it', b: 'Answer: C - Lock away the root user. It has unlimited power and cannot be restricted                     by IAM policies.' },
            { f: 'You need to deploy a Lambda function that connects to an RDS database in a                     Private Subnet. (A) Assign a Public IP to Lambda (B) Configure Lambda with VPC Subnets and Security                     Group (C) Use NAT Gateway (D) Use API Gateway', b: 'Answer: B - To access resources in a VPC (RDS, ElastiCache), the Lambda function                     must be configured with the VPC\\'s Subnets and Security Groups.' },
            { f: 'Which DynamoDB feature allows you to query data by a non-key attribute? (A)                     Partition Key (B) Sort Key (C) Global Secondary Index (GSI) (D) Scan', b: 'Answer: C - GSIs allow you to create an alternate index with a different                     Partition/Sort Key to support efficient queries on non-primary attributes.' },
            { f: 'Update an AWS CloudFormation stack but preview changes before applying them.                     (A) Change Set (B) Stack Set (C) Drift Detection (D) Nested Stack', b: 'Answer: A - "Change Sets" allow you to preview how proposed changes to a stack might                     impact your running resources before you execute them.' },
            { f: 'You need to debug performance issues in a distributed microservices                     application. You want to see the "Waterfalls" of service calls. (A) CloudTrail (B) X-Ray (C)                     CloudWatch Logs (D) VPC Flow Logs', b: 'Answer: B - AWS X-Ray provides end-to-end tracing capabilities, visualizing the                     service map and latency "waterfalls" for each request.' },
            { f: 'Securely store and retrieve database passwords in code without hardcoding. You                     also need *automatic rotation*. (A) Systems Manager Parameter Store (B) Secrets Manager (C)                     Environment Variables (D) S3 Encryption', b: 'Answer: B - Secrets Manager is specifically designed for secrets (DB creds) and                     supports *native automatic rotation* (unlike Parameter Store).' },
            { f: 'Your API Gateway is receiving too many requests, overwhelming your backend.                     (A) Enable Caching (B) Configure Throttling (Rate Limiting) (C) Use Usage Plans (D) All of the above', b: 'Answer: D - All are valid, but Throttling (account-level or stage-level) is the                     primary mechanism to protect the backend from spikes.' },
            { f: 'Which CodeDeploy Hook runs *before* traffic is shifted to the new replacement                     task set? (A) BeforeInstall (B) AfterInstall (C) BeforeAllowTraffic (D) ApplicationStop', b: 'Answer: C - `BeforeAllowTraffic` is used (often with Lambda) to run validation tests                     on the new deployment *before* the Load Balancer routes actual traffic.' },
            { f: 'Lambda function is failing because the deployment package is 100MB (too                     large). (A) Request limit increase (B) Use S3 to upload ZIP (C) Use Lambda Layers (D) Use EC2', b: 'Answer: C - Lambda Layers allow you to separate dependencies (numpy, pandas, SDKs)                     from your function code, keeping the deployment package small.' },
            { f: 'Ensure writes to DynamoDB are durable across multiple regions (Active-Active).                     (A) DynamoDB Streams (B) Global Tables (C) DAX (D) Read Replicas', b: 'Answer: B - DynamoDB Global Tables provide a fully managed, multi-region, and                     multi-active database (writes in any region replicate to all others).' },
            { f: 'You need to enable Cross-Origin Resource Sharing (CORS) for your Serverless                     API. (A) Enable CORS on S3 (B) Enable CORS on API Gateway methods (C) Enable CORS on Lambda (D) Use                     CloudFront', b: 'Answer: B - If using API Gateway, you must Enable CORS on the resources/methods to                     allow browsers to call the API from a different domain.' },
            { f: 'Which buildspec.yml phase is used to install dependencies? (A) pre_build (B)                     build (C) install (D) post_build', b: 'Answer: C - The `install` phase is dedicated to installing package dependencies                     (e.g. `npm install`, `pip install`).' },
            { f: 'Handle "Hot Partitions" in DynamoDB caused by a bad Partition Key design. (A)                     Increase WCU (B) Use DAX (C) Improve Key Design (add random suffix/sharding) (D) Use S3', b: 'Answer: C - The root cause of hot partitions is uneven data distribution. The fix is                     to choose a better Partition Key or use "Write Sharding".' },
            { f: 'Authenticate users to your API Gateway using a 3rd party (e.g. Auth0) token.                     (A) IAM Authorizer (B) Cognito User Pool Authorizer (C) Lambda Authorizer (Custom) (D) Resource                     Policy', b: 'Answer: C - Lambda Authorizers (formerly Custom Authorizers) allow you to validate                     bearer tokens from any 3rd party provider using custom logic.' },
            { f: 'Trace an item change in DynamoDB and trigger a Lambda function. (A) Kinesis                     Data Streams (B) DynamoDB Streams (C) CloudWatch Events (D) SNS', b: 'Answer: B - DynamoDB Streams captures a time-ordered sequence of item modifications                     (INSERT, MODIFY, DELETE) which can trigger Lambda.' },
            { f: 'Your Lambda function needs to process items from a Kinesis Data Stream in                     order. (A) Use FIFO Queue (B) Kinesis guarantees order per Shard (C) Use Step Functions (D) Use SQS', b: 'Answer: B - Kinesis guarantees order *within a shard*. Lambda processes records from                     each shard sequentially.' },
            { f: 'Which deployment strategy shifts traffic 10% every 10 minutes? (A) Canary (B)                     Linear (C) All-at-Once (D) Blue/Green', b: 'Answer: B - Linear deployment shifts traffic in equal increments over a set time                     (e.g. "Linear10PercentEvery10Minutes"). Canary is usually a small step then jump.' },
            { f: 'X-Ray: You want to add custom data to a trace that you can *search* and filter                     by (e.g. "GameID"). (A) Metadata (B) Annotations (C) Segments (D) Subsegments', b: 'Answer: B - "Annotations" are key-value pairs indexed for use with filter                     expressions. "Metadata" is not indexed.' },
            { f: 'Optimize DynamoDB cost for a table with infrequent, unpredictable access. (A)                     Provisioned Capacity (B) On-Demand Capacity (C) Reserved Capacity (D) Auto Scaling', b: 'Answer: B - On-Demand capacity is best for unpredictable ("spiky") or infrequent                     workloads as you pay only for what you use (per request).' },
            { f: 'Secure your S3 bucket so ONLY CloudFront can access it (prevent direct                     access). (A) Signed URLs (B) Origin Access Control (OAC) / Identity (OAI) (C) Bucket Policy (D) WAF', b: 'Answer: B - Configuring CloudFront OAC (recommended) or OAI and updating the S3                     Bucket Policy restricts access to only the CloudFront distribution.' },
            { f: 'Which CLI command allows you to assume an IAM Role? (A) aws iam create-role                     (B) aws sts assume-role (C) aws get-session-token (D) aws configure', b: 'Answer: B - `aws sts assume-role` returns the temporary security credentials                     (AccessKey, SecretKey, SessionToken) for the role.' },
            { f: 'Serverless "Choreography" pattern: Services communicate via events without a                     central coordinator. (A) Step Functions (B) EventBridge (C) Batch (D) SWF', b: 'Answer: B - EventBridge (Event Bus) enables the "Choreography" pattern where                     services publish/subscribe to events loosely decoupled. (Step Functions is "Orchestration").' },
            { f: 'Encrypt environment variables in a Lambda function helper. (A) Use KMS (B) Use                     S3 (C) Use RDS (D) Use Base64', b: 'Answer: A - Lambda environment variables are encrypted at rest by default, but you                     can use "Helpers" to encrypt sensitive vars using a specific KMS key.' },
            { f: 'Which Elastic Beanstalk deployment policy requires NO downtime and maintains                     full capacity? (A) All at once (B) Rolling (C) Rolling with additional batch (D) Immutable', b: 'Answer: C - "Rolling with additional batch" launches a new batch of instances first,                     ensuring capacity never drops below 100% during deployment.' },
            { f: 'Store the state of a user\\'s shopping cart session (Speed is priority). (A) S3                     (B) ElastiCache (Redis) (C) Glacier (D) EFS', b: 'Answer: B - Redis is the standard for in-memory session stores (shopping carts)                     requiring sub-millisecond access.' },
            { f: 'A developer accidentally committed a 500MB file to CodeCommit. How to fix? (A)                     git rm (B) git filter-branch (or BFG Repo-Cleaner) (C) Delete repo (D) Ignore', b: 'Answer: B - To completely remove a large file from git history (to reduce repo                     size), you must use `git filter-branch` or the BFG tool.' },
            { f: 'You need to route API Gateway traffic to different versions of Lambda (v1, v2)                     based on a "canary" weight. (A) Use Lambda Aliases (B) Use Route 53 (C) Use ALB (D) Use CloudFront', b: 'Answer: A - Lambda Aliases support "Traffic Shifting" (routing weights) between two                     function versions.' },
            { f: 'Which S3 Bucket Policy Principle grants access to "Anyone"? (A) "Principal":                     "Everyone" (B) "Principal": "*" (C) "Principal": "Public" (D) "Principal": "Anonymous"', b: 'Answer: B - A wildcard `*` in the Principal field means any anonymous user (Public                     Access).' },
            { f: 'Handle duplicate messages in an SQS Standard Queue. (A) They don\\'t happen (B)                     Use Idempotency in the consumer (C) Use FIFO (D) Delete queue', b: 'Answer: B - Standard Queues guarantee "At-Least-Once" delivery (duplicates                     possible). The application must handle idempotency (converting duplicates to no-op).' },
            { f: 'Instrument your application code to send custom metrics to CloudWatch. (A)                     Embedded Metric Format (EMF) (B) CloudTrail (C) X-Ray (D) VPC Flow Logs', b: 'Answer: A - CloudWatch Embedded Metric Format (EMF) allows generating custom metrics                     from logs asynchronously, avoiding API blocking.' },
            { f: 'You need to run a Docker container for 15 minutes to process a file. (A)                     Lambda (B) Fargate (ECS) Task (C) EC2 Reserved (D) AppRunner', b: 'Answer: B - Lambda has a 15-minute timeout. If the job runs exactly or slightly                     over, Fargate Tasks are safer and still serverless.' },
            { f: 'Which API Gateway type is lowest cost and optimized for Lambda? (A) REST API                     (B) HTTP API (C) WebSocket API (D) Private API', b: 'Answer: B - HTTP APIs are designed to be lighter, faster, and cheaper (up to 71%)                     than REST APIs for serverless workloads.' },
            { f: 'What file defines the SAM (Serverless Application Model) infrastructure? (A)                     buildspec.yml (B) template.yaml (C) appspec.yml (D) serverless.json', b: 'Answer: B - SAM uses a `template.yaml` (extension of CloudFormation) to define                     functions, APIs, and tables.' },
            { f: 'Limit a specific tenant to 50 requests/sec on your API. (A) Usage Plans & API                     Keys (B) WAF (C) Shield (D) IAM', b: 'Answer: A - API Gateway Usage Plans (linked to API Keys) allow granular throttling                     and quotas per client/tenant.' },
            { f: 'Ensure CodePipeline stops if a test fails. (A) It does automatically (B)                     Manual intervention (C) SNS (D) CloudWatch', b: 'Answer: A - If any action (like CodeBuild running tests) fails, the Pipeline stops                     execution at that stage.' },
            { f: 'Your app needs to support "Sticky Sessions" (Session Affinity). (A) ALB (B)                     NLB (C) Route 53 (D) Global Accelerator', b: 'Answer: A - Application Load Balancers (ALB) verify session cookies to route the                     user to the same target instance.' },
            { f: 'Monitor the deep internals of your Java app (JVM heap, garbage collection,                     threads). (A) CloudWatch Default (B) CloudWatch Application Insights / Profiler (C) CloudTrail (D)                     Config', b: 'Answer: B - Application Insights / FindBugs / Profiler provide deep runtime                     visibility into code performance (Java, Python, etc.).' },
            { f: 'Which IAM Policy element creates an "Exception" to a statement? (A) NotAction                     / NotResource / NotPrincipal (B) Exception (C) Deny (D) Allow', b: 'Answer: A - `NotResource` allows the policy to apply to "everything EXCEPT this".                     (e.g. Allow * on NotResource: ProductionBucket).' },
            { f: 'Efficiently query S3 data using "S3 Select". (A) It retrieves the whole object                     (B) It filters data *on the S3 server side* sending back only the result (C) It uses Athena (D) It                     uses Redshift', b: 'Answer: B - S3 Select improves performance by filtering CSV/JSON content within S3,                     transferring less data over the network.' },
            { f: 'Automate the creation of a "Dev" environment every morning. (A) CloudFormation                     (B) Console click (C) EBS Snapshots (D) Route 53', b: 'Answer: A - Infrastructure as Code (CloudFormation/CDK) is the standard for                     ephemeral environment creation.' },
            { f: 'Which database supports Graph data (relationships)? (A) RDS (B) Neptune (C)                     DynamoDB (D) DocumentDB', b: 'Answer: B - Amazon Neptune is a fully managed Graph database (social networks,                     recommendation engines).' },
            { f: 'Your Lambda reads from a Kinesis Stream. You get                     "ProvisionedThroughputExceededException". (A) Increase Lambda memory (B) Increase Kinesis Shards (C)                     Reduce Lambda timeout (D) Configure Retry', b: 'Answer: B - Throughput is bound by shards (1MB/sec write, 2MB/sec read). To scale                     up, you must "Reshard" (split shards) to increase capacity.' },
            { f: 'A developer needs to upload a 5GB file to S3 effectively. (A) PUT Object (B)                     Multipart Upload (C) Zip it (D) Email it', b: 'Answer: B - Multipart Upload is recommended for >100MB and *required* for singular                     objects >5GB (though S3 limit is 5TB, simple PUT tops out at 5GB).' },
            { f: 'Decouple a monolithic app. Order Service must accept orders even if Inventory                     Service is down. (A) REST API (B) SQS Queue (C) Direct Call (D) Shared DB', b: 'Answer: B - A queue buffers the requests. The Inventory service can process them                     when it recovers.' },
            { f: 'Which tool allows you to debug Lambda locally? (A) AWS SAM CLI (B) AWS Console                     (C) CloudShell (D) CodeStar', b: 'Answer: A - `sam local invoke` and `sam local start-api` allow testing Lambda/API                     Gateway locally using Docker.' },
            { f: 'Store user session state for an app scaling across multiple regions. (A)                     DynamoDB Global Tables (B) S3 (C) EBS (D) Instance Store', b: 'Answer: A - Global Tables provide multi-master replication, ideal for session state                     that needs to follow the user globally.' },
            { f: 'Secure your API key in a mobile app. (A) Hardcode it (B) Store in S3 (C) You                     can\\'t secure it fully on client; use Cognito/Authentication flow instead (D) Use WAF', b: 'Answer: C - Anything on a mobile device can be extracted. The best practice is to                     exchange user credentials (Cognito) for temporary AWS keys.' },
            { f: 'Perform "Blue/Green" deployment on ECS. (A) CodeDeploy (B) CodeBuild (C)                     CodeCommit (D) CloudTrail', b: 'Answer: A - CodeDeploy can completely manage traffic shifting (Blue/Green) for ECS                     services and Lambda functions.' },
            { f: 'Optimistic Locking in DynamoDB prevents overwrites. It uses: (A) Version                     Number attribute (B) Timestamp (C) Read Locks (D) Global Lock', b: 'Answer: A - You pass a condition `attribute_exists` checking a Version Number. If                     the version on server > version you have, the write fails.' },
            { f: '"Cold Start" in Lambda is mitigated by: (A) Provisioned Concurrency (B) More                     Memory (C) Keep-warm scripts (D) Ignoring it', b: 'Answer: A - Provisioned Concurrency keeps a specified number of environments                     initialized and ready to respond in double-digit ms.' },
            { f: 'Which CLI pagination option handles large output? (A) --no-paginate (B)                     --starting-token / --max-items (C) --filter (D) --zip', b: 'Answer: B - To handle large lists, you use `--max-items` to limit page size and                     `--starting-token` (NextToken) to fetch the next page.' },
            { f: 'Connect your on-premise data center to VPC using both Direct Connect (Primary)                     and VPN (Backup). (A) Use Transit Gateway or VGW (B) Use only VPN (C) Use two Direct Connects (D)                     Use Internet', b: 'Answer: A - This is a classic Hybrid HA pattern. If DX fails, BGP routing fails over                     to the Site-to-Site VPN.' },
            { f: 'Improve CloudFront performance for dynamic content (PUT/POST) that cannot be                     cached. (A) S3 Transfer Acceleration (B) CloudFront Dynamic Caching (C) Lambda@Edge (D) Use                     CloudFront as a fast proxy using AWS backbone', b: 'Answer: D - Even without caching, CloudFront accelerates dynamic content by routing                     traffic over the optimized AWS global network (shielding from public internet jitter).' },
            { f: 'Multi-Region Disaster Recovery with RTO < 15 mins. (A) Backup & Restore (B)                         Pilot Light (C) Warm Standby (D) Active-Active', b: 'Answer: C - Warm Standby keeps a scaled-down version of the app running.                             Scaling it up takes minutes, fitting the <15 min RTO. (Pilot Light usually takes                                 longer).' },
            { f: 'You need to migrate 200 TB of data to S3 but can\\'t use a physical                                 device (Security policy). You have a 10Gbps Direct Connect. (A) Snowball (B) DataSync                                 (C) S3 Console (D) FTP', b: 'Answer: B - AWS DataSync is an online transfer service optimized to                                 maximize saturation of the 10Gbps DX link for large transfers.' },
            { f: 'Resolve DNS queries from your On-premise network for AWS private                                 hosted zones. (A) Route 53 Inbound Resolver Endpoint (B) Route 53 Outbound Resolver                                 Endpoint (C) Conditional Forwarder (D) Public Zone', b: 'Answer: A - The Inbound Endpoint allows on-premise DNS servers to                                 forward queries to Route 53 for AWS private domains.' },
            { f: 'Microservices architecture. Service A needs to call Service B.                                 Discovery should be dynamic. (A) Hardcode IP (B) AWS Cloud Map / Route 53 (C) Text file                                 (D) Excel', b: 'Answer: B - AWS Cloud Map allows services to register themselves and                                 others to discover them via API or DNS (Service Discovery).' },
            { f: 'Securely access AWS services from an EC2 instance in a private                                 subnet, keeping traffic private. (A) NAT Gateway (B) VPC Endpoint (Interface or Gateway)                                 (C) Egress-Only IGW (D) VPN', b: 'Answer: B - VPC Endpoints are the most secure way for private access.                                 (Gateway for S3/Dynamo, Interface for others).' },
            { f: 'Which routing policy routes traffic to the endpoint with the                                 lowest network latency? (A) Geolocation (B) Geoproximity (C) Latency (D) Weighted', b: 'Answer: C - Latency routing measures the round-trip time from the user                                 to the AWS region and routes to the fastest one.' },
            { f: 'Create a specialized firewall rule to block traffic from a                                 specific country (e.g. Embargoed nation) for the *entire* VPC. (A) Security Group (B)                                 WAF (C) Network Firewall (D) NACL', b: 'Answer: C - AWS Network Firewall provides stateful, managed network                                 protection for your VPC, including domain/IP filtering (Suricata compatible). NACL is                                 too simple (no geo), WAF is Layer 7 only.' },
            { f: 'Share a Directory Service (Microsoft AD) across multiple accounts.                                 (A) AD Connector (B) Simple AD (C) Directory Sharing (D) Trust Relationship', b: 'Answer: C - AWS Managed Microsoft AD allows you to share the directory                                 with other AWS accounts (Seamless Domain Join).' },
            { f: 'Migrate a VMware vSphere setup to AWS "As-is" (Lift & Shift)                                 quickly. (A) EC2 Import (B) VMware Cloud on AWS (C) DMS (D) Re-platform', b: 'Answer: B - VMC on AWS allows you to run your VMware stack directly on                                 bare-metal AWS infrastructure without changing code or tooling.' },
            { f: 'Cost Optimization: You have a stable workload but need flexibility                                 to change instance families later. (A) Standard RI (B) Convertible RI (C) Spot (D)                                 Savings Plan (Compute)', b: 'Answer: D - Compute Savings Plans offer similar discounts to Convertible                                 RIs but with much greater flexibility (move between Fargate, Lambda, EC2 families).' },
            { f: 'S3 Object Lock requires which feature to be enabled? (A)                                 Encryption (B) Versioning (C) Logging (D) MFA', b: 'Answer: B - Object Lock (WORM - Write Once Read Many) works on specific                                 version IDs, so Versioning is a prerequisite.' },
            { f: 'Control access to a specific API Gateway stage using IP                                 whitelisting. (A) Security Group (B) Resource Policy on API Gateway (C) NACL (D) IAM', b: 'Answer: B - API Gateway Resource Policies allow you to define Allow/Deny                                 rules based on source IP ranges (CIDR blocks).' },
            { f: 'Decouple a monolithic legacy app where the consumer is SLOWER than                                 the producer. (A) SNS (B) SQS (C) Kinesis (D) EventBridge', b: 'Answer: B - A Queue (SQS) is the classic buffer. It absorbs the burst                                 from the fast producer and lets the slow consumer process at its own pace.' },
            { f: 'A company needs to run thousands of batch computing jobs. (A) AWS                                 Batch (B) Lambda (C) Step Functions (D) Systems Manager', b: 'Answer: A - AWS Batch dynamically provisions the optimal quantity and                                 type of compute resources (e.g., CPU or memory optimized instances) based on volume.' },
            { f: 'Which service provides centralized backup management for EBS, RDS,                                 DynamoDB, EFS? (A) AWS Backup (B) S3 (C) Glacier (D) Snapshot Manager', b: 'Answer: A - AWS Backup is a policy-based service to centralize and                                 automate data protection across AWS services.' },
            { f: 'Grant a 3rd party auditor Read-Only access to your account. (A)                                 Creating IAM User + Keys (B) Cross-Account Role with External ID (C) Share Password (D)                                 Open SG', b: 'Answer: B - The secure pattern is: Create a Role in your account, trust                                 the Auditor\\'s Account ID, and require an "External ID" (secret) to prevent Confused                                 Deputy problem.' },
            { f: 'Improve performance of global users uploading large videos to S3.                                 (A) S3 Transfer Acceleration (B) Multipart Upload (C) CloudFront (D) VPN', b: 'Answer: A - S3 Transfer Acceleration uses CloudFront Edge Locations to                                 route uploads to S3 over the AWS backbone network (faster than public internet).' },
            { f: 'Which disaster recovery strategy has the HIGHEST cost? (A) Backup                                 & Restore (B) Pilot Light (C) Warm Standby (D) Multi-Site Active/Active', b: 'Answer: D - Active/Active requires running full capacity in two regions                                 simultaneously (Double the cost).' },
            { f: 'A legacy app uses hardcoded IP addresses. You need to migrate to                                 cloud but keep IPs. (A) Bring Your Own IP (BYOIP) (B) EIP (C) NAT (D) VPN', b: 'Answer: A - BYOIP allows you to bring your own publicly routable IP                                 address range to AWS to avoid breaking hardcoded dependencies.' },
            { f: 'Securely connect multiple VPCs and On-premise locations with a                                 single hub. (A) Transit Gateway (B) VPC Peering (C) Direct Connect Gateway (D) VPN                                 CloudHub', b: 'Answer: A - Transit Gateway solves the "peering mesh" complexity problem                                 by acting as a central regional router.' },
            { f: 'Ensure your EKS cluster control plane logs are audited. (A) Enable                                 Control Plane Logging to CloudWatch (B) Check node logs (C) Check Pod logs (D) WireShark', b: 'Answer: A - You must explicitly enable "Control Plane Logging" (API                                 server, Audit, Authenticator) in EKS to send them to CloudWatch Logs.' },
            { f: 'Which service allows you to query logs in S3, CloudWatch, and JSON                                 files using SQL? (A) Athena (B) Redshift (C) RDS (D) Aurora', b: 'Answer: A - Athena is the serverless interactive query service for S3.' },
            { f: 'Prevent sensitive data from leaving the network (Data                                 Exfiltration) via DNS. (A) Route 53 Resolver DNS Firewall (B) WAF (C) Shield (D)                                 Security Group', b: 'Answer: A - Route 53 Resolver DNS Firewall lets you filter and block                                 outbound DNS queries to known malicious domains.' },
        ];
        
        let currentIndex = 0;
        const frontEl = document.getElementById('card-front');
        const backEl = document.getElementById('card-back');
        const innerEl = document.getElementById('card-inner');
        const counterEl = document.getElementById('counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateCard() {
            frontEl.textContent = cards[currentIndex].f;
            backEl.textContent = cards[currentIndex].b;
            counterEl.textContent = `${currentIndex + 1} / ${cards.length}`;
            innerEl.classList.remove('is-flipped');
        }

        document.getElementById('card').addEventListener('click', () => {
            innerEl.classList.toggle('is-flipped');
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < cards.length - 1) {
                currentIndex++;
                updateCard();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        });

        // Initialize
        updateCard();
    </script>
