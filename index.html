<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCP Digital Leader - Exam Simulation Portal</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="container">
        <h1>GCP Digital Leader (2026)</h1>
        <h3>Exam Dashboard</h3>

        <a href="flashcards.html" class="exam-link">
            Flashcards
            <span class="meta">Core Service Mappings</span>
        </a>

        <a href="revision.html" class="exam-link">
            Revision Guide
            <span class="meta">High-density summary of the four 2026 GCP domains</span>
        </a>

        <h3>Practice Exams</h3>
        <div id="exam-links">
            <!-- Populated by JS -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const examLinksContainer = document.getElementById('exam-links');
            const overallProgress = JSON.parse(localStorage.getItem('exam_progress') || '{}');

            for (let i = 1; i <= 5; i++) {
                const examId = `set${i}`;
                const prog = overallProgress[examId];

                let progressText = 'Not started';
                let progressFill = 0;

                if (prog && prog.answered > 0) {
                    progressText = `${prog.correct}/${prog.answered} correct (${prog.percent}%)`;
                    progressFill = Math.round((prog.answered / 50) * 100);
                }

                examLinksContainer.innerHTML += `
                    <a href="exams/gcp-digital-leader/set${i}.html" class="exam-link">
                        Set ${i}
                        <span class="meta">${progressText}</span>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progressFill}%"></div>
                        </div>
                    </a>
                `;
            }
        });
    </script>
</body>
</html>
