<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 300px;
            margin-top: 20px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            border: 2px solid #fff;
            background-color: #111;
            font-size: 13px;
            text-align: center;
        }

        .flashcard-back {
            transform: rotateY(180deg);
            color: #0f0;
            border-color: #0f0;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .controls .btn {
            flex: 1;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="btn">← Dashboard</a>
        <h1>Flashcards</h1>

        <div id="card-counter" style="text-align: center; margin-top: 10px;">1 / 1</div>

        <div class="flashcard-container">
            <div class="flashcard" id="flashcard">
                <div class="flashcard-face flashcard-front" id="card-front">Front</div>
                <div class="flashcard-face flashcard-back" id="card-back">Back</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="btn-prev">Previous</button>
            <button class="btn" id="btn-next">Next</button>
        </div>
    </div>

    <script>
        const cards = [
            { front: "BigQuery", back: "Serverless, highly scalable, and cost-effective multi-cloud data warehouse." },
            { front: "Cloud Spanner", back: "Fully managed relational database with unlimited scale, strong consistency, and up to 99.999% availability." },
            { front: "Cloud Run", back: "Managed compute platform that lets you run containers directly on top of Google's scalable infrastructure." },
            { front: "Cloud Functions", back: "Serverless execution environment for building and connecting cloud services." },
            { front: "Vertex AI", back: "Machine learning (ML) platform that lets you train and deploy ML models and AI applications." },
            { front: "Compute Engine", back: "Customizable virtual machines." },
            { front: "Google Kubernetes Engine (GKE)", back: "Managed environment for deploying, managing, and scaling your containerized applications using Google infrastructure." },
            { front: "Cloud Storage", back: "Object storage for companies of all sizes." },
            { front: "Cloud SQL", back: "Fully managed relational database service for MySQL, PostgreSQL, and SQL Server." },
            { front: "Pub/Sub", back: "Messaging service for exchanging event data among applications and services." }
        ];

        let currentIndex = 0;
        const flashcard = document.getElementById('flashcard');
        const frontEl = document.getElementById('card-front');
        const backEl = document.getElementById('card-back');
        const counterEl = document.getElementById('card-counter');

        function updateCard() {
            frontEl.textContent = cards[currentIndex].front;
            backEl.textContent = cards[currentIndex].back;
            counterEl.textContent = `${currentIndex + 1} / ${cards.length}`;
            flashcard.classList.remove('is-flipped');
        }

        flashcard.addEventListener('click', () => {
            flashcard.classList.toggle('is-flipped');
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentIndex < cards.length - 1) {
                currentIndex++;
                updateCard();
            }
        });

        // Swipe support
        let touchstartX = 0;
        let touchendX = 0;

        document.querySelector('.flashcard-container').addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        });

        document.querySelector('.flashcard-container').addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchendX < touchstartX - 50) {
                // Swipe Left (Next)
                if (currentIndex < cards.length - 1) {
                    currentIndex++;
                    updateCard();
                }
            }
            if (touchendX > touchstartX + 50) {
                // Swipe Right (Prev)
                if (currentIndex > 0) {
                    currentIndex--;
                    updateCard();
                }
            }
        }

        updateCard();
    </script>
</body>
</html>
